syntax = "proto3";

package accounts;

service AccountsService {
  // Returns the account for (user_id, currency), creating a zero-balance row if missing
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);

  // Credits sandbox USDT to available_balance (dev/sandbox faucet)
  rpc DepositSandboxFunds (DepositSandboxFundsRequest) returns (DepositSandboxFundsResponse);

  // Moves funds available → locked (reserve for an order)
  rpc LockBalance (LockBalanceRequest) returns (LockBalanceResponse);

  // Moves funds locked → available (release reserve)
  rpc UnlockBalance (UnlockBalanceRequest) returns (UnlockBalanceResponse);

  // Credits confirmed on-chain deposit to available_balance (Double-Entry: ON_CHAIN_DEPOSIT)
  rpc CreditDepositFunds (CreditDepositFundsRequest) returns (CreditDepositFundsResponse);

  // Debits confirmed on-chain withdrawal from locked_balance (Double-Entry: WITHDRAWAL)
  rpc DebitWithdrawalFunds (DebitWithdrawalFundsRequest) returns (DebitWithdrawalFundsResponse);
}

message GetBalanceRequest {
  string user_id = 1;
  string currency = 2; // empty → USDT
}

message GetBalanceResponse {
  BalanceResponse balance = 1;
}

message DepositSandboxFundsRequest {
  string user_id = 1;
  string amount = 2;            // positive decimal string
  string currency = 3;          // empty → USDT
  string idempotency_key = 4;   // optional; duplicate key returns the original result
}

message DepositSandboxFundsResponse {
  BalanceResponse balance = 1;
}

message LockBalanceRequest {
  string user_id = 1;
  string amount = 2;
  string currency = 3;
  string idempotency_key = 4;
  string reference_id = 5;      // e.g. future order id
}

message LockBalanceResponse {
  BalanceResponse balance = 1;
}

message UnlockBalanceRequest {
  string user_id = 1;
  string amount = 2;
  string currency = 3;
  string idempotency_key = 4;
  string reference_id = 5;
}

message UnlockBalanceResponse {
  BalanceResponse balance = 1;
}

message CreditDepositFundsRequest {
  string user_id = 1;
  string amount = 2;            // positive decimal string
  string currency = 3;          // "ETH" | "USDT"
  string idempotency_key = 4;   // e.g. tx_hash or composite key
  string reference_id = 5;      // e.g. tx_hash or deposit id
}

message CreditDepositFundsResponse {
  BalanceResponse balance = 1;
}

message DebitWithdrawalFundsRequest {
  string user_id = 1;
  string amount = 2;            // positive decimal string
  string currency = 3;          // "ETH" | "USDT"
  string idempotency_key = 4;   // e.g. withdrawal_id or tx_hash
  string reference_id = 5;      // e.g. tx_hash or withdrawal request id
}

message DebitWithdrawalFundsResponse {
  BalanceResponse balance = 1;
}

message BalanceResponse {
  string account_id = 1;
  string user_id = 2;
  string currency = 3;
  string available_balance = 4;
  string locked_balance = 5;
  // available + locked (calculated in SQL or post-update)
  string total_balance = 6; 
  // Unix seconds
  int64 updated_at = 7;
}
