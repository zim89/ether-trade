name: ether-trade

services:
  postgres:
    image: postgres:16-alpine
    container_name: ether-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: identity_db,accounts_db,orders_db,transfers_db,copy_trading_db
    ports:
      - '5432:5432'
    volumes:
      - ether_trade_postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: ether-trade-redis
    restart: unless-stopped
    command: valkey-server --save "" --loglevel notice
    ports:
      - '6379:6379'
    volumes:
      - ether_trade_redis_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: ether-trade-anvil
    restart: unless-stopped
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--port', '8545', '--chain-id', '31337', '--block-time', '1']
    ports:
      - '8545:8545'
    healthcheck:
      test: ['CMD', 'cast', 'block-number', '--rpc-url', 'http://127.0.0.1:8545']
      interval: 3s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ether-trade-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      # KRaft configuration (Node ID, Roles, Controller Quorum)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Listeners configuration (Internal Docker network & External Host access)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Partitions and Replication defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Cluster ID for automated formatting in KRaft mode
      CLUSTER_ID: 4L622nShTUiBENbznQpscQ
    volumes:
      - ether_trade_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ether-trade-kafka-ui
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: ether-trade-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: ether-trade-otel-collector
    restart: unless-stopped
    profiles:
      - obs
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC receiver (Host access for microservices)
      - '4318:4318' # OTLP HTTP receiver
      - '8889:8889' # Prometheus metrics exporter endpoint
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ether-trade-jaeger
    restart: unless-stopped
    profiles:
      - obs
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # Jaeger Web UI
    # Note: internal OTLP port 4317 is accessible via internal network jaeger:4317 without host conflict

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ether-trade-prometheus
    restart: unless-stopped
    profiles:
      - obs
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ether_trade_prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ether-trade-grafana
    restart: unless-stopped
    profiles:
      - obs
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '3100:3000' # Map to 3100 on host to keep 3000 free for et-client
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ether_trade_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

volumes:
  ether_trade_postgres_data:
    name: ether_trade_postgres_data
  ether_trade_redis_data:
    name: ether_trade_redis_data
  ether_trade_kafka_data:
    name: ether_trade_kafka_data
  ether_trade_prometheus_data:
    name: ether_trade_prometheus_data
  ether_trade_grafana_data:
    name: ether_trade_grafana_data
